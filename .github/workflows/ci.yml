name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Steps are skipped until the Spring Boot project exists (B1).
      - uses: actions/setup-java@v4
        if: hashFiles('backend/pom.xml') != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Steps are skipped until the React project exists (F1).
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run lint
      - name: Test
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm test --if-present -- --run
      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run build
