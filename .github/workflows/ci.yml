name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Steps are skipped until the Spring Boot project exists (B1).
      - uses: actions/setup-java@v4
        if: hashFiles('backend/pom.xml') != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Steps are skipped until the React project exists (F1).
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run lint
      - name: Test
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm test --if-present -- --run
      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run build

  # Builds the production image, runs it with a fresh database and drives it with Playwright
  # (the key flows from specs/FRONTEND.md §9 plus axe accessibility checks).
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      APP_OWNER_EMAIL: e2e@example.com
      APP_OWNER_PASSWORD: e2e-password-for-ci
      E2E_OWNER_EMAIL: e2e@example.com
      E2E_OWNER_PASSWORD: e2e-password-for-ci
      E2E_BASE_URL: http://localhost:8080
      E2E_ALLOW_REGENERATE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Start the app (production image + PostgreSQL)
        run: |
          docker compose --profile app up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && exit 0; sleep 2; done
          docker compose --profile app logs app
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e
      - name: App logs
        if: failure()
        run: docker compose --profile app logs app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
