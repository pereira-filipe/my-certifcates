name: Deploy

# Deploys to Fly.io after CI passes on main. Needs the FLY_API_TOKEN repository secret (DEPLOY.md);
# without it the job only leaves a note.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check the Fly token
        id: token
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::FLY_API_TOKEN is not set, so nothing was deployed (see DEPLOY.md)."; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          # Deploy exactly the commit that passed CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only
