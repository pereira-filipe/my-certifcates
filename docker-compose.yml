# Development only: PostgreSQL for the backend. Production uses the PaaS's managed Postgres.
# Usage: cp .env.example .env && docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycertificates}
      POSTGRES_USER: ${POSTGRES_USER:-mycertificates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mycertificates}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
