server:
  # Behind the PaaS proxy: trust X-Forwarded-* so redirects and secure cookies use https.
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/javascript,image/svg+xml
  servlet:
    session:
      cookie:
        secure: true

spring:
  datasource:
    hikari:
      # Neon's free tier sleeps after 5 idle minutes; idle connections would keep it awake and use up
      # the free compute hours. Close them when unused (the first request after a pause wakes it up).
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: 5
  web:
    resources:
      cache:
        cachecontrol:
          # Built JS/CSS have content hashes in their names, so they can be cached for a year.
          # index.html is served by SpaController with no-cache.
          max-age: 365d
          cache-public: true

logging:
  level:
    root: INFO

management:
  health:
    # Fly's health check runs every few seconds; it must not touch the database (see datasource above).
    db:
      enabled: false
