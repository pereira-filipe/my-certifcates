server:
  # Behind the PaaS proxy: trust X-Forwarded-* so redirects and secure cookies use https.
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/javascript,image/svg+xml
  servlet:
    session:
      cookie:
        secure: true

spring:
  web:
    resources:
      cache:
        cachecontrol:
          # Built JS/CSS have content hashes in their names, so they can be cached for a year.
          # index.html is served by SpaController with no-cache.
          max-age: 365d
          cache-public: true

logging:
  level:
    root: INFO
