# Fly.io deployment (specs/BACKEND.md §7). Step-by-step setup: DEPLOY.md.
# The app name is also the address: https://<app>.fly.dev — change both lines if you pick another name.
app = "filipe-certificates"
primary_region = "gru" # São Paulo, next to the Neon database (aws-sa-east-1)

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  APP_STORAGE_LOCAL_DIR = "/data/uploads"
  APP_BASE_URL = "https://filipe-certificates.fly.dev"
  # Secrets (fly secrets import < .env.production): SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
  # SPRING_DATASOURCE_PASSWORD, APP_OWNER_EMAIL, APP_OWNER_PASSWORD

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a recruiter shouldn't wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health" # doesn't touch the database, so Neon can sleep

# Uploaded certificate files. One volume = one machine, so deploys have a short downtime (fine here).
[mounts]
  source = "uploads"
  destination = "/data/uploads"
  initial_size = "1gb"
  snapshot_retention = 14 # daily snapshots kept 14 days

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb" # Spring Boot + PDF thumbnails need more than 512 MB
